# CodeTrace AI — Docker Compose (Optional)
# Only needed when using EXECUTION_MODE=docker with a Docker sandbox.
# The default subprocess mode does NOT require Docker or docker-compose.

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - EXECUTION_MODE=docker
      - SANDBOX_IMAGE=codetrace-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-build:
        condition: service_completed_successfully

  sandbox-build:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: codetrace-sandbox:latest
    command: echo "Sandbox image built"
